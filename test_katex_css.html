<!DOCTYPE html>
<html>
<head>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
<style>
.katex, .katex * { border-color: black !important; }
.katex .katex-hline { border-bottom: 1px solid currentColor !important; background-color: currentColor !important; }
.katex .vertical-separator { border-right: 1px solid currentColor !important; background-color: currentColor !important; }
.katex .array { border-collapse: collapse; }
</style>
</head>
<body>
<div id="out"></div>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
<script>
document.getElementById('out').innerHTML = katex.renderToString(`
\\begin{array}{|c|c|}
\\hline
a & b \\\\
\\hline
c & d \\\\
\\hline
\\end{array}
`);
</script>
</body>
</html>
